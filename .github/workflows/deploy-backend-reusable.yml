name: Deploy Backend (reusable)

on:
  workflow_call:
    inputs:
      zappa_stage:
        description: Zappa stage name (e.g. noma_prod, noma_staging)
        required: true
        type: string
      requirements_file:
        description: pip requirements file relative to system repo root
        required: true
        type: string
      enforce_prod_cors:
        description: When true, enforce production CORS rules (ALLOW_DEV_ORIGINS must be off)
        required: false
        type: boolean
        default: false
      system_git_ref:
        description: Git ref of the system repo to checkout (e.g. main, staging)
        required: false
        type: string
        default: main
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      GH_PAT:
        required: true
      ZAPPA_SETTINGS:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Log deploy context
        run: |
          echo "Zappa stage: ${{ inputs.zappa_stage }}"
          echo "Requirements: ${{ inputs.requirements_file }}"
          echo "System git ref: ${{ inputs.system_git_ref }}"
          echo "Event: ${{ github.event_name }}"
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "Triggered by: ${{ github.event.client_payload.triggered_by }}"
            echo "Source repo: ${{ github.event.client_payload.source_repo }}"
            echo "Source SHA: ${{ github.event.client_payload.sha }}"
          fi

      - name: Checkout system repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.system_git_ref }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Configure AWS profile for Zappa
        run: |
          mkdir -p ~/.aws
          echo "[noma]" > ~/.aws/credentials
          echo "aws_access_key_id = ${{ secrets.AWS_ACCESS_KEY_ID }}" >> ~/.aws/credentials
          echo "aws_secret_access_key = ${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> ~/.aws/credentials
          echo "[profile noma]" > ~/.aws/config
          echo "region = us-east-1" >> ~/.aws/config
          echo "output = json" >> ~/.aws/config

      - name: Configure git for private repos
        run: |
          git config --global url."https://${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Create virtual environment and install tools
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install "zappa==0.59.0" setuptools

      - name: Install application dependencies
        run: |
          source venv/bin/activate
          pip install -r "${{ inputs.requirements_file }}"

      - name: Write zappa_settings.json from secret
        run: echo '${{ secrets.ZAPPA_SETTINGS }}' > zappa_settings.json

      - name: Apply Noma boot env from versioned profile
        env:
          ZAPPA_STAGE: ${{ inputs.zappa_stage }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          KEY = "NOMA_OWN_APP"
          UNMOUNT_KEY = "NOMA_UNMOUNT_BLUEPRINTS"
          POLICY_KEY = "DATA_API_RING_POLICY"
          stage_name = os.environ["ZAPPA_STAGE"]
          profile = "staging" if stage_name == "noma_staging" else "production"
          path = Path("config/profiles") / f"{profile}.yaml"

          profile_vars = {}
          for raw in path.read_text(encoding="utf-8").splitlines():
              line = raw.strip()
              if not line or line.startswith("#") or ":" not in line:
                  continue
              key, _, raw_value = line.partition(":")
              profile_vars[key.strip()] = raw_value.strip().strip("'").strip('"')

          with open("zappa_settings.json", encoding="utf-8") as fh:
              data = json.load(fh)
          stage = data.get(stage_name)
          if not isinstance(stage, dict):
              raise SystemExit(f"stage {stage_name!r} missing from zappa_settings.json")
          env = stage.setdefault("environment_variables", {})
          if not isinstance(env, dict):
              raise SystemExit(f"stage {stage_name!r} environment_variables is not an object")

          actions = []
          for sync_key in (KEY, UNMOUNT_KEY):
              value = profile_vars.get(sync_key) or None
              before = env.get(sync_key)
              if value:
                  env[sync_key] = value
                  actions.append(f"set {sync_key}={value!r}")
              else:
                  env.pop(sync_key, None)
                  actions.append(f"unset {sync_key} (was {before!r})")
          # Staging Lambda env is already at the 4KB cap. The versioned
          # profile deliberately omits DATA_API_RING_POLICY (noma.api.register
          # composes the rings). Dropping the leftover secret key is what
          # makes room for NOMA_OWN_APP. Production is untouched.
          dropped_policy = False
          if stage_name == "noma_staging" and POLICY_KEY not in profile_vars:
              dropped_policy = env.pop(POLICY_KEY, None) is not None
          print(f"profile={path} {'; '.join(actions)} dropped_{POLICY_KEY}={dropped_policy}")
          with open("zappa_settings.json", "w", encoding="utf-8") as fh:
              json.dump(data, fh, ensure_ascii=False)
          PY

      - name: Validate Zappa settings for stage
        env:
          ZAPPA_STAGE: ${{ inputs.zappa_stage }}
          ENFORCE_PROD_CORS: ${{ inputs.enforce_prod_cors }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from urllib.parse import urlparse

          stage_name = os.environ["ZAPPA_STAGE"]
          enforce_prod = os.environ.get("ENFORCE_PROD_CORS", "").lower() in {"1", "true", "yes"}

          with open("zappa_settings.json", "r", encoding="utf-8") as fh:
              data = json.load(fh)

          stage = data.get(stage_name) or {}
          if not stage:
              print(f"ERROR: Stage {stage_name!r} not found in zappa_settings.json")
              sys.exit(1)

          env = stage.get("environment_variables") or {}

          required = ("FE_BASE_URL", "APP_FE_BASE_URL", "CORS_ALLOWED_ORIGINS")
          missing = [k for k in required if not str(env.get(k, "")).strip()]
          if missing:
              print(f"ERROR: Missing required zappa env vars: {', '.join(missing)}")
              sys.exit(1)

          # DATA_API_RING_POLICY is optional here, and deliberately so.
          #
          # It was required for one day. That was wrong twice over: the rings a
          # /v1 resource owns are closed by noma.api.register() regardless of
          # config, so the requirement was redundant; and it only ran on a push to
          # this repo, not on the repository_dispatch that a code repo fires — so
          # it blocked the safe path while the unguarded one deployed anyway.
          #
          # What is still worth checking is the shape, for rings added here on top
          # of the declared ones: a typo'd mode is ignored at runtime (fail-open,
          # so a typo cannot take the data API down) and would be invisible.
          bad_policy = []
          for entry in str(env.get("DATA_API_RING_POLICY", "")).split(","):
              if not entry.strip():
                  continue
              ring, sep, mode = entry.partition(":")
              if not sep or not ring.strip() or mode.strip().lower() not in ("deny", "deny_write"):
                  bad_policy.append(entry.strip())
          if bad_policy:
              print(
                  "ERROR: DATA_API_RING_POLICY entries must be '<ring>:deny' or "
                  f"'<ring>:deny_write'. Bad: {', '.join(bad_policy)}"
              )
              sys.exit(1)

          def normalize_origin(value: str) -> str:
              v = (value or "").strip().rstrip("/")
              p = urlparse(v)
              if p.scheme not in ("http", "https") or not p.netloc:
                  raise ValueError(f"invalid origin: {value!r}")
              if p.path not in ("", "/"):
                  raise ValueError(f"origin must not include path: {value!r}")
              return f"{p.scheme}://{p.netloc}"

          fe_origin = normalize_origin(str(env.get("FE_BASE_URL", "")))
          app_fe_origin = normalize_origin(str(env.get("APP_FE_BASE_URL", "")))
          cors_raw = str(env.get("CORS_ALLOWED_ORIGINS", ""))
          cors_origins = {
              normalize_origin(part)
              for part in cors_raw.split(",")
              if part.strip()
          }
          expected = {fe_origin, app_fe_origin}
          missing_from_cors = sorted(expected - cors_origins)
          if missing_from_cors:
              print(
                  "ERROR: CORS_ALLOWED_ORIGINS must include FE_BASE_URL and APP_FE_BASE_URL. "
                  f"Missing: {', '.join(missing_from_cors)}"
              )
              sys.exit(1)

          if enforce_prod:
              allow_dev = str(env.get("ALLOW_DEV_ORIGINS", "")).strip().lower()
              if allow_dev in {"1", "true", "yes", "on"}:
                  print("ERROR: ALLOW_DEV_ORIGINS must be false/empty in production stage")
                  sys.exit(1)

          print(f"zappa_settings.json validation OK for stage {stage_name!r}")
          PY

      - name: Deploy with manual packaging script
        env:
          REQUIREMENTS_CI_FILE: ${{ inputs.requirements_file }}
          ZAPPA_STAGE: ${{ inputs.zappa_stage }}
        run: |
          source venv/bin/activate
          chmod +x ./zappa_update.sh
          FN="noma-$(echo "$ZAPPA_STAGE" | tr '_' '-')"
          if aws lambda get-function --function-name "$FN" --region us-east-1 >/dev/null 2>&1; then
            echo "Lambda $FN exists — running zappa update --clean"
            ./zappa_update.sh "$ZAPPA_STAGE" update --clean
          else
            echo "Lambda $FN not found — running zappa deploy --clean (first-time)"
            ./zappa_update.sh "$ZAPPA_STAGE" deploy --clean
          fi
