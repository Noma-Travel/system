name: Patch Zappa Ring Policy

# One-shot: put DATA_API_RING_POLICY into ZAPPA_SETTINGS / ZAPPA_SETTINGS_STAGING.
#
# Run this BEFORE deploying the ring-policy change. The deploy now refuses to run
# without the variable, on purpose: renglo-api no longer carries the payment
# redaction and trip approval-stripping rules, so a deployment that did not
# declare which rings are closed would serve them with no rules at all.
#
# The value is not typed in here — it is read from config/profiles/{staging,production}.yaml,
# which is what `noma run` already uses for the local backend. One source of truth,
# so the Lambda and a local run cannot drift apart.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the change without writing the secrets
        required: false
        default: false
        type: boolean

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Patch GitHub Zappa secrets
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GH_REPO: ${{ github.repository }}
          ZAPPA_SETTINGS: ${{ secrets.ZAPPA_SETTINGS }}
          ZAPPA_SETTINGS_STAGING: ${{ secrets.ZAPPA_SETTINGS_STAGING }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          pip install --quiet pyyaml
          python <<'PY'
          import json, os, subprocess, sys
          import yaml

          KEY = "DATA_API_RING_POLICY"
          VALID_MODES = ("deny", "deny_write")
          DRY = str(os.environ.get("DRY_RUN", "")).lower() in ("1", "true", "yes")

          def value_from_profile(path: str) -> str:
              with open(path, encoding="utf-8") as fh:
                  profile = yaml.safe_load(fh) or {}
              value = str(profile.get(KEY) or "").strip()
              if not value:
                  raise SystemExit(f"{path} has no {KEY}")
              # Same shape check the deploy runs. Catch it here rather than at deploy:
              # a typo'd mode is ignored at runtime (fail-open, so an env var typo
              # cannot take the data API down), which makes it invisible otherwise.
              for entry in value.split(","):
                  if not entry.strip():
                      continue
                  ring, sep, mode = entry.partition(":")
                  if not sep or not ring.strip() or mode.strip().lower() not in VALID_MODES:
                      raise SystemExit(f"{path}: bad entry {entry.strip()!r}")
              return value

          def patch(raw: str, label: str, value: str) -> dict:
              if not raw or not raw.strip():
                  raise SystemExit(f"{label} secret is empty")
              data = json.loads(raw)
              if not isinstance(data, dict):
                  raise SystemExit(f"{label} is not a JSON object")
              touched = []
              for stage_name, stage in data.items():
                  if not isinstance(stage, dict):
                      continue
                  env = stage.get("environment_variables")
                  if not isinstance(env, dict):
                      continue
                  before = env.get(KEY)
                  env[KEY] = value
                  print(f"{label} stage={stage_name!r}")
                  print(f"  before: {before if before else '(missing)'}")
                  print(f"  after : {value}")
                  touched.append(stage_name)
              if not touched:
                  raise SystemExit(f"{label}: no stage with environment_variables found")
              return data

          def set_secret(name: str, payload: dict) -> None:
              body = json.dumps(payload, ensure_ascii=False)
              subprocess.run(
                  ["gh", "secret", "set", name, "--repo", os.environ["GH_REPO"]],
                  input=body,
                  text=True,
                  check=True,
              )

          prod_value = value_from_profile("config/profiles/production.yaml")
          staging_value = value_from_profile("config/profiles/staging.yaml")

          prod = patch(os.environ["ZAPPA_SETTINGS"], "ZAPPA_SETTINGS", prod_value)
          staging = patch(os.environ["ZAPPA_SETTINGS_STAGING"], "ZAPPA_SETTINGS_STAGING", staging_value)

          if DRY:
              print("\nDry run — secrets not written.")
              sys.exit(0)

          set_secret("ZAPPA_SETTINGS", prod)
          set_secret("ZAPPA_SETTINGS_STAGING", staging)
          print("\nPatched ZAPPA_SETTINGS and ZAPPA_SETTINGS_STAGING successfully.")
          print("Both stages are patched because the deploy now REQUIRES the key —")
          print("leaving it out of production would block production deploys entirely.")
          print("Setting it does not deploy anything; it takes effect on the next deploy.")
          PY
