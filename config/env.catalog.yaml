# Central env catalog — structure only; values in profiles/ + Secrets Manager
# routing: true => affected by handler_overrides, not env profile alone

vars:
  WL_NAME:
    description: White-label application name
    secret: false
    consumers: [backend]
    required_in: [staging, production]

  BASE_URL:
    description: Backend API base URL
    secret: false
    routing: true
    consumers: [backend, noma, console]
    required_in: [staging, production]

  FE_BASE_URL:
    description: Frontend base URL
    secret: false
    consumers: [backend]
    required_in: [staging, production]

  APP_FE_BASE_URL:
    description: App frontend base URL for invite links
    secret: false
    consumers: [backend]
    required_in: [staging, production]

  DOC_BASE_URL:
    description: Documentation base URL
    secret: false
    consumers: [backend]
    required_in: [staging, production]

  API_GATEWAY_ARN:
    description: API Gateway ARN for cronjobs
    secret: false
    consumers: [backend]
    required_in: [staging, production]

  SYS_ENV:
    description: System environment identifier
    secret: false
    consumers: [backend]
    required_in: [staging, production]

  URL_PREFIX:
    description: Zappa URL prefix / stage name
    secret: false
    consumers: [backend]
    required_in: [staging, production]

  DYNAMODB_ENTITY_TABLE:
    description: DynamoDB entities table
    secret: false
    consumers: [backend]
    required_in: [staging, production]

  DYNAMODB_BLUEPRINT_TABLE:
    description: DynamoDB blueprints table
    secret: false
    consumers: [backend]
    required_in: [staging, production]

  DYNAMODB_RINGDATA_TABLE:
    description: DynamoDB ring data table
    secret: false
    consumers: [backend]
    required_in: [staging, production]

  DYNAMODB_REL_TABLE:
    description: DynamoDB relations table
    secret: false
    consumers: [backend]
    required_in: [staging, production]

  DYNAMODB_CHAT_TABLE:
    description: DynamoDB chat table
    secret: false
    consumers: [backend]
    required_in: [staging, production]

  COGNITO_REGION:
    description: AWS Cognito region
    secret: false
    consumers: [backend, console]
    required_in: [staging, production]

  COGNITO_USERPOOL_ID:
    description: Cognito user pool ID
    secret: false
    consumers: [backend, noma, console]
    required_in: [staging, production]

  COGNITO_APP_CLIENT_ID:
    description: Cognito app client ID
    secret: false
    consumers: [backend, noma, console]
    required_in: [staging, production]

  COGNITO_CHECK_TOKEN_EXPIRATION:
    description: Validate Cognito token expiration
    secret: false
    consumers: [backend]
    required_in: [staging, production]

  CSRF_SESSION_KEY:
    description: Flask CSRF session key
    secret: true
    consumers: [backend]
    required_in: [staging, production]

  SECRET_KEY:
    description: Flask secret key
    secret: true
    consumers: [backend]
    required_in: [staging, production]

  S3_BUCKET_NAME:
    description: S3 bucket name
    secret: false
    consumers: [backend, noma]
    required_in: [staging, production]

  WEBSOCKET_CONNECTIONS:
    description: API Gateway WebSocket management endpoint (HTTPS)
    secret: false
    routing: true
    consumers: [backend, noma, console]
    required_in: [staging, production]

  ALLOW_DEV_ORIGINS:
    description: Allow local dev CORS origins on backend
    secret: false
    consumers: [backend]
    required_in: [staging, production]

  OPENAI_API_KEY:
    description: OpenAI API key
    secret: true
    consumers: [backend]
    required_in: [staging, production]

  RESEND_API_KEY:
    description: Resend email API key
    secret: true
    consumers: [backend, noma]
    required_in: [staging, production]

  # ── Flight-change negotiation agent ───────────────────────────────────────
  # See extensions/backend/docs/AGENTE_TROCA_DE_VOO.md (runbook) and
  # CONFIGURAR_RESEND.md (mail infrastructure).
  # NOTE: RESEND_API_KEY must be a FULL-ACCESS key for this agent. Inbound
  # webhooks are metadata-only; the handler fetches the body from
  # GET /emails/receiving/{id}, which a send-only key 401s on.

  RESEND_WEBHOOK_SECRET:
    description: Svix signing secret for the Resend inbound webhook. The inbound
      route is public and unauthenticated, so this is the only thing separating
      a real desk reply from a forged one. Fail-closed when deployed.
    secret: true
    consumers: [backend]
    required_in: [staging, production]

  FLIGHT_CHANGE_INBOUND_DOMAIN:
    description: Resend Inbound (MX-verified) domain the reply+<token> addresses live on
    secret: false
    consumers: [backend]
    required_in: [staging, production]

  FLIGHT_CHANGE_EMAIL_FROM:
    description: From header for desk e-mails; must be a Resend-verified sending domain
    secret: false
    consumers: [backend]
    required_in: [staging, production]

  FLIGHT_CHANGE_PROVIDER_EMAIL:
    description: Default consolidator desk address when kickoff omits provider.contact_email
    secret: false
    consumers: [backend]
    required_in: [staging, production]

  FLIGHT_CHANGE_EMAIL_OBSERVER:
    description: Comma-separated silent BCC on every negotiation e-mail (both the
      desk thread and the user notices), and last-resort recipient when no user
      identity resolves. Prefer a team alias over a personal inbox.
    secret: false
    consumers: [backend]
    required_in: [staging, production]

  SLACK_WEBHOOK_FLIGHT_CHANGE:
    description: >-
      Incoming webhook for the "alteracoes" channel. Exactly one ping per case,
      when the desk's payment link needs settling. Empty = notice skipped.
    secret: true
    consumers: [backend]
    required_in: [staging, production]

  FLIGHT_CHANGE_ALLOW_UNSIGNED_WEBHOOK:
    description: "'1' accepts unsigned inbound mail on a deployed env. Bootstrap only —
      Resend issues the signing secret after the endpoint is registered. Clear it after."
    secret: false
    consumers: [backend]
    required_in: []

  FLIGHT_CHANGE_NOTIFY_REDIRECT:
    description: Comma-separated; diverts ALL user-facing flight-change e-mail here.
      Testing aid — must stay empty in staging and production.
    secret: false
    consumers: [backend]
    required_in: []

  FLIGHT_CHANGE_NOTIFY_USER_EMAIL:
    description: "'0'/'false'/'no' silences the user notification e-mails (on by default)"
    secret: false
    consumers: [backend]
    required_in: []

  FLIGHT_CHANGE_EMAIL_DRY_RUN:
    description: "'1' logs outbound mail instead of calling Resend"
    secret: false
    consumers: [backend]
    required_in: []

  FLIGHT_CHANGE_FE_BASE_URL:
    description: Base URL for deep links in the notification e-mails; falls back to
      FE_BASE_URL then APP_FE_BASE_URL
    secret: false
    consumers: [backend]
    required_in: []

  FLIGHT_CHANGE_MODEL:
    description: Model for the inbound-email comprehension step (default gpt-4o)
    secret: false
    consumers: [backend]
    required_in: []

  FLIGHT_CHANGE_TIMEOUT_AWAITING_PROVIDER:
    description: Hours before a case the desk never answered is parked as stalled (default 24)
    secret: false
    consumers: [backend]
    required_in: []

  FLIGHT_CHANGE_TIMEOUT_AWAITING_PROVIDER_REISSUE:
    description: Same, after the desk link was already paid (default 72)
    secret: false
    consumers: [backend]
    required_in: []

  SERPAPI_API_KEY:
    description: SerpApi key for NOMA location/flight autocomplete
    secret: true
    consumers: [noma]
    required_in: [staging, production]

  INVITE_FROM:
    description: Invitation email From header
    secret: false
    consumers: [backend]
    required_in: [staging, production]

  SES_INVITE_SENDER:
    description: Legacy invite sender fallback
    secret: false
    consumers: [backend]
    required_in: [staging, production]

  NOMA_ROLE_ENFORCEMENT:
    description: Role-based access enforcement flag
    secret: false
    consumers: [backend]
    required_in: [staging, production]

  NOMA_OWN_APP:
    description: >-
      Legado; o boot ignora. The process is always noma.runtime.app.create_app.
      Remover depois da Z8-D. Staging profiles may still set "1"; that is a
      no-op.
    secret: false
    consumers: [backend]
    required_in: []

  NOMA_UNMOUNT_BLUEPRINTS:
    description: >-
      Legado; o boot ignora (Z8-B apagou o mount). Remover depois da Z8-D.
      Staging profiles may still list the nine; that is a no-op.
    secret: false
    consumers: [backend]
    required_in: []

  NOMA_MOUNT_RENGLO_ROUTES:
    description: >-
      Legado; o boot ignora (Z8-B apagou o mount). Remover depois da Z8-D.
    secret: false
    consumers: [backend]
    required_in: []

  DATA_API_RING_POLICY:
    # Rings the generic /_data CRUD must refuse. Optional: the rings a /v1
    # resource owns are declared in noma/api/ and applied by noma.api.register(),
    # so they close without this variable. Set it only to close a ring no
    # resource owns — it can add rings and tighten one, never open one.
    description: Extra rings to close on the generic data API (ring:deny|deny_write, comma separated)
    secret: false
    consumers: [backend]

  VITE_API_URL:
    description: Console API URL
    secret: false
    routing: true
    consumers: [console]
    required_in: [staging, production]

  VITE_WEBSOCKET_URL:
    description: Console WebSocket URL
    secret: false
    routing: true
    consumers: [console]
    required_in: [staging, production]

  VITE_EXTENSIONS:
    description: Console extension packages
    secret: false
    consumers: [console]
    required_in: [staging, production]

  VITE_WL_LOGO:
    description: Console white-label small logo path
    secret: false
    consumers: [console]
    required_in: [staging, production]

  VITE_WL_LOGIN:
    description: Console white-label login logo path
    secret: false
    consumers: [console]
    required_in: [staging, production]

  VITE_DEV_MODE:
    description: Console dev mode flag
    secret: false
    consumers: [console]
    required_in: [staging, production]

  NEXT_PUBLIC_API_BASE_URL:
    description: NOMA REST API base URL
    secret: false
    routing: true
    consumers: [noma]
    required_in: [staging, production]

  NEXT_PUBLIC_CHAT_WS:
    description: NOMA chat WebSocket URL
    secret: false
    routing: true
    consumers: [noma]
    required_in: [staging, production]

  NEXT_PUBLIC_AWS_USER_POOL_ID:
    description: NOMA Cognito pool ID
    secret: false
    consumers: [noma]
    required_in: [staging, production]

  NEXT_PUBLIC_AWS_USER_POOL_CLIENT_ID:
    description: NOMA Cognito client ID
    secret: false
    consumers: [noma]
    required_in: [staging, production]

  NEXT_PUBLIC_PORTFOLIO_ID:
    description: NOMA default portfolio (local/E2E only)
    secret: false
    consumers: [noma]
    required_in: []

  NEXT_PUBLIC_ORG_ID:
    description: NOMA default org (local/E2E only)
    secret: false
    consumers: [noma]
    required_in: []
